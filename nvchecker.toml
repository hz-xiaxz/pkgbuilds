# Upstream version sources, one entry per package directory.
# Run ./update to check them all and bump outdated PKGBUILDs.
[__config__]
# nvchecker only writes newver when oldver is set too; ./update compares against
# the PKGBUILDs, so old_ver.json is just nvchecker's own cache
oldver = "old_ver.json"
newver = "new_ver.json"

[karere]
# release tags are v<ver>; the repo also carries cef-* and webkitgtk-* tags
source = "git"
git = "https://github.com/tobagin/karere.git"
include_regex = 'v\d+(\.\d+)+'
prefix = "v"

[zed-delta-bin]
# same source bump.sh reads, so the two never disagree
source = "regex"
url = "https://raw.githubusercontent.com/zed-industries/delta-nix/HEAD/releases.json"
regex = '"version":\s*"([^"]+)"'

[zoom]
# zoom.us redirects "latest" to cdn.zoom.us/prod/<version>/, the URL the PKGBUILD pins
source = "httpheader"
url = "https://zoom.us/client/latest/zoom_x86_64.pkg.tar.xz"
regex = '/prod/([\d.]+)/'
